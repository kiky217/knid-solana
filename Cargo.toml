[package]
name = "knid-solana-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54", features = ["macros", "rt", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
base64 = "0.22.1"
bs58 = "0.5.1"
serde_json = "1.0.145"
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }
